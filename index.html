<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ViviBon Cover</title>

  <!-- Google Fonts for Elegance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Cinzel:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Microsoft Clarity (100% Free, Unlimited Replay & Heatmaps) -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
      try {
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      } catch(e){ console.warn('[Clarity] Init error:', e); }
    })(window, document, "clarity", "script", "yf41ikpys2");
  </script>

  <style>
    :root {
      /* Warm Peach Cream Palette matching user reference image */
      --bg-page: #FFF8F3;
      --bg-card: #FFF8F3;
      --card-border: rgba(255, 255, 255, 0.9);
      --text-main: #3C3028;
      --text-subtle: #7A6D63;
      --text-muted: #9E9085;
      
      /* Active Highlight Accent (Coral / Warm Terracotta) */
      --coral-accent: #E85D3F;
      --coral-glow-border: #FF8F73;
      --coral-bg-pill: #FFFFFF;
      --coral-shadow-glow: rgba(232, 93, 63, 0.22);
      
      /* CTA Warm Butter-Peach Gradient */
      --cta-start: #FEE7D6;
      --cta-end: #F6CCA7;
      --cta-text: #4A3B31;
      
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 10px;
      font-family: "Cormorant Garamond", -apple-system, BlinkMacSystemFont, "Playfair Display", serif;
      overflow-x: hidden;
    }

    /* Ambient Warm Glow */
    .ambient-glow-top {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 380px;
      background: radial-gradient(circle, rgba(254, 235, 220, 0.8) 0%, rgba(255, 248, 243, 0) 70%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }

    /* Outer Container: Clean Warm Cream Box */
    .app-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      background: var(--bg-card);
      padding: 12px 16px 20px 16px;
      display: flex;
      flex-direction: column;
    }

    /* Top Centered Header - Elegant Cursive Title */
    .header-bar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      margin-bottom: 12px;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--text-main);
      font-family: "Alex Brush", "Playfair Display", cursive, serif;
      text-align: center;
      transform: translateY(2px);
    }
    .header-back-btn {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s ease;
    }
    .header-back-btn:active {
      transform: translateY(-50%) scale(0.92);
      opacity: 0.7;
    }

    /* ================= VIEW 1: Entry Studio ================= */
    #view-entry {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* Hero Viewport (3:4 ratio with large soft rounded corners) */
    .hero-box {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 28px;
      overflow: hidden;
      background: #F2E8DF;
      box-shadow: 0 10px 30px -10px rgba(180, 140, 110, 0.2);
    }
    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.25s var(--ease-smooth);
    }

    /* Floating Round Upload Button in Bottom-Right Corner */
    .upload-btn-floating {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #3C3028;
      transition: all 0.2s var(--ease-smooth);
      z-index: 5;
    }
    .upload-btn-floating:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.85);
    }

    /* Category Pill Selector Bar (Soft Frosted Box, 4 Columns) */
    .category-pills-bar {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 14px;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .category-pill {
      padding: 6px 2px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-subtle);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s var(--ease-smooth);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .category-pill:active {
      transform: scale(0.96);
    }
    .category-pill.active {
      background: #FFFFFF;
      color: var(--coral-accent);
      border-color: rgba(232, 93, 63, 0.15);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .category-pill-name {
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.1px;
      white-space: nowrap;
      font-family: "Cormorant Garamond", serif;
    }

    /* Reference Templates Scroll Carousel */
    .template-carousel-container {
      margin-top: 14px;
      position: relative;
      width: 100%;
    }
    .template-cards-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 4px 2px 8px 2px;
      scrollbar-width: none;
    }
    .template-cards-row::-webkit-scrollbar {
      display: none;
    }

    /* Reference Template Card */
    .template-card {
      flex: 0 0 102px;
      width: 102px;
      scroll-snap-align: start;
      background: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      padding: 6px 6px 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.22s var(--ease-smooth);
      box-shadow: 0 2px 8px rgba(180, 140, 110, 0.08);
      position: relative;
    }
    .template-card:active {
      transform: scale(0.96);
    }
    .template-card.active {
      border: 1.5px solid var(--coral-glow-border);
      box-shadow: 0 0 0 2px rgba(232, 93, 63, 0.15), 0 4px 14px rgba(232, 93, 63, 0.12);
    }

    /* Image Box inside Template Card */
    .template-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      background: #EAE0D5;
    }
    .template-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Label text below thumbnail */
    .template-label {
      margin-top: 6px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-main);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      line-height: 1.2;
      font-family: "Cormorant Garamond", serif;
    }
    .template-card.active .template-label {
      color: var(--coral-accent);
      font-weight: 600;
    }

    /* Right Edge Hint */
    .scroll-edge-hint {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 8px;
      width: 24px;
      background: linear-gradient(90deg, rgba(255, 248, 243, 0) 0%, var(--bg-card) 100%);
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    /* Primary CTA Button */
    .btn-cta {
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      border-radius: 9999px;
      background: linear-gradient(180deg, var(--cta-start) 0%, var(--cta-end) 100%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 6px 20px -4px rgba(220, 160, 120, 0.35);
      color: var(--cta-text);
      font-size: 16px;
      font-weight: 500;
      font-family: "Cormorant Garamond", "Playfair Display", serif;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s var(--ease-smooth);
    }
    .btn-cta:active {
      transform: scale(0.975);
      box-shadow: 0 3px 10px -2px rgba(220, 160, 120, 0.25);
    }

    /* ================= VIEW 2: Result Showcase (Exact Match to Screenshot 2) ================= */
    #view-result {
      display: none;
      flex-direction: column;
      width: 100%;
    }
    .poster-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 28px;
      overflow: hidden;
      background: #1C1917;
      box-shadow: 0 12px 36px -8px rgba(0, 0, 0, 0.25);
    }
    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .poster-img.original-layer {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.12s ease-out;
      z-index: 10;
      pointer-events: none;
    }

    /* Magazine Typography Overlay (Exact Match) */
    .poster-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, transparent 25%, transparent 58%, rgba(0,0,0,0.85) 100%);
      z-index: 2;
      transition: opacity 0.16s var(--ease-smooth);
    }
    /* Top Brand: Clean White Serif Uppercase */
    .poster-top-brand {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 2.2px;
      color: #FFFFFF;
      text-transform: uppercase;
      font-family: "Cinzel", "Times New Roman", serif;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .poster-bottom-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    /* Sub-tag: Small Muted Tracking Text */
    .poster-tag {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.72);
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }
    /* Main Title: Large Bold Serif with High Editorial Presence */
    .poster-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #FFFFFF;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      line-height: 1.15;
      font-family: "Cormorant Garamond", "Playfair Display", serif;
    }

    /* Floating "Hold to compare" Pill (Matching Screenshot 2 exact grey pill) */
    .compare-pill {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(200, 202, 206, 0.72);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 9999px;
      padding: 7px 15px;
      font-size: 11px;
      font-weight: 600;
      color: #383735;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transition: all 0.18s var(--ease-smooth);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }
    .compare-pill:active {
      transform: scale(0.93);
      background: rgba(220, 222, 226, 0.9);
    }
    .compare-pill.active {
      background: rgba(28, 28, 30, 0.88);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .compare-pill.active svg {
      stroke: #FFFFFF;
    }

    /* ================= LOADER COMPONENT (Exact Match to Screenshot 1) ================= */
    .loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(60, 48, 38, 0.35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.25s var(--ease-smooth);
    }
    .loader-card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 36px;
      padding: 36px 28px 30px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 320px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 60px -12px rgba(80, 50, 30, 0.25);
    }

    /* Concentric Circles Loader (Exact Screenshot 1 Match) */
    .concentric-loader-box {
      position: relative;
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    /* Outer subtle ring */
    .concentric-ring-outer {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }
    /* Animated coral arc */
    .concentric-arc-svg {
      position: absolute;
      width: 76px;
      height: 76px;
      animation: spin-arc 1.6s linear infinite;
    }
    @keyframes spin-arc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* Inner solid glowing coral dot */
    .concentric-center-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--coral-accent);
      box-shadow: 0 0 10px rgba(232, 93, 63, 0.4);
      z-index: 2;
    }

    /* Linear Progress Bar with Percentage Tag */
    .loader-progress-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .loader-progress-track {
      flex: 1;
      height: 3.5px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 9999px;
      overflow: hidden;
    }
    .loader-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--coral-accent);
      border-radius: 9999px;
      transition: width 0.35s ease;
    }
    .loader-percentage-text {
      font-size: 13px;
      font-weight: 500;
      color: #38302A;
      font-family: "Cormorant Garamond", serif;
      min-width: 32px;
      text-align: right;
    }

    /* Loader Texts */
    .loader-text {
      font-size: 17px;
      font-weight: 600;
      color: #2D241D;
      font-family: "Cormorant Garamond", "Playfair Display", serif;
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }
    .loader-sub {
      font-size: 12px;
      font-weight: 500;
      color: #8C8075;
      font-family: "Cormorant Garamond", serif;
    }

    /* Toast */
    .toast-pill {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 20px);
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: rgba(45, 36, 30, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 20px;
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s var(--ease-smooth);
      z-index: 200;
      white-space: nowrap;
      font-family: -apple-system, sans-serif;
    }
    .toast-pill.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Apple Native Save Sheet (HIG Aligned) */
    .save-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 500;
      animation: appleModalFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes appleModalFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .save-modal-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 26px;
      padding: 20px 18px 18px;
      max-width: 356px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.28), 0 0 0 0.5px rgba(0, 0, 0, 0.08);
      position: relative;
    }
    .save-modal-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(118, 118, 128, 0.12);
      border: none;
      color: #636366;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background 0.15s, transform 0.1s;
      z-index: 10;
    }
    .save-modal-close-btn:active {
      background: rgba(118, 118, 128, 0.24);
      transform: scale(0.92);
    }
    .save-modal-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      width: 100%;
      padding-top: 2px;
    }
    .save-modal-title {
      font-size: 17px;
      font-weight: 600;
      color: #1D1D1F;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      letter-spacing: -0.3px;
    }
    .save-modal-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #48484A;
      background: rgba(118, 118, 128, 0.08);
      border: 0.5px solid rgba(0, 0, 0, 0.06);
      padding: 5px 14px;
      border-radius: 9999px;
      letter-spacing: -0.1px;
    }
    .save-modal-badge-icon {
      color: #0071E3;
      flex-shrink: 0;
    }
    .save-modal-img-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 18px;
      overflow: hidden;
      background: #F5F5F7;
      border: 0.5px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 10px 28px -6px rgba(0, 0, 0, 0.14);
    }
    .save-modal-img {
      width: 100%;
      max-height: 410px;
      object-fit: contain;
      display: block;
      -webkit-touch-callout: default !important;
      pointer-events: auto !important;
      user-select: auto !important;
      -webkit-user-select: auto !important;
    }
    .save-modal-actions {
      display: flex;
      width: 100%;
      gap: 10px;
      margin-top: 2px;
    }
    .save-modal-btn {
      flex: 1;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      letter-spacing: -0.2px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .save-modal-btn:active {
      transform: scale(0.98);
      opacity: 0.85;
    }
    .save-modal-btn.primary {
      background: #1D1D1F;
      color: #FFFFFF;
    }
    .save-modal-btn.secondary {
      background: rgba(118, 118, 128, 0.12);
      color: #1D1D1F;
    }

    #render-canvas { display: none; }
  </style>
</head>
<body>

  <div class="ambient-glow-top"></div>

  <div class="app-card">

    function updateScrollEdgeHint() {
      const row = document.getElementById("template-cards-row");
      const hint = document.getElementById("scroll-edge-hint");
      if (!row || !hint) return;
      const atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 10;
      hint.style.opacity = atEnd ? '0' : '1';
    }

    function initDragScroll() {
      const row = document.getElementById("template-cards-row");
      if (!row) return;

      let isDown = false;
      let startX = 0;
      let scrollLeft = 0;
      let moved = false;

      row.addEventListener('mousedown', (e) => {
        isDown = true;
        moved = false;
        startX = e.pageX - row.offsetLeft;
        scrollLeft = row.scrollLeft;
      });

      window.addEventListener('mouseup', () => {
        isDown = false;
      });

      row.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - row.offsetLeft;
        const walk = (x - startX) * 1.5;
        if (Math.abs(walk) > 4) moved = true;
        row.scrollLeft = scrollLeft - walk;
      });

      row.addEventListener('scroll', updateScrollEdgeHint, { passive: true });
    }

    /**
     * P0-1: Downsample and optimize image file to prevent iOS Safari OOM crashes
     * Scales max edge to <= 1500px, outputs high-quality JPEG (0.85), memory footprint < 25MB
     */
    function downsampleImageFile(file, maxEdge = 1500, quality = 0.85) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          return reject(new Error('Please select a valid image file.'));
        }

        const objectUrl = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          try {
            let width = img.naturalWidth || img.width;
            let height = img.naturalHeight || img.height;

            if (width > maxEdge || height > maxEdge) {
              if (width >= height) {
                height = Math.round((height * maxEdge) / width);
                width = maxEdge;
              } else {
                width = Math.round((width * maxEdge) / height);
                height = maxEdge;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            if (!ctx) {
              URL.revokeObjectURL(objectUrl);
              return reject(new Error('Canvas 2D context unavailable'));
            }

            ctx.drawImage(img, 0, 0, width, height);
            const optimizedDataUrl = canvas.toDataURL('image/jpeg', quality);

            URL.revokeObjectURL(objectUrl);
            canvas.width = 0;
            canvas.height = 0;

            resolve({
              dataUrl: optimizedDataUrl,
              width,
              height,
              originalSizeKb: Math.round(file.size / 1024),
              optimizedSizeKb: Math.round((optimizedDataUrl.length * 3) / 4 / 1024)
            });
          } catch (err) {
            URL.revokeObjectURL(objectUrl);
            reject(err);
          }
        };

        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('Failed to load and decode image'));
        };

        img.src = objectUrl;
      });
    }

    async function handleUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      if (file.size > 20 * 1024 * 1024) {
        showToast("Photo exceeds 20MB limit. Please choose another.");
        return;
      }

      showToast("Optimizing portrait resolution... ✦", 1000);

      try {
        const result = await downsampleImageFile(file, 1500, 0.85);
        userPhotoUrl = result.dataUrl;
        isUserUploaded = true;
        document.getElementById("entry-preview").src = userPhotoUrl;
        document.getElementById("res-original-img").src = userPhotoUrl;
        showToast("Photo uploaded successfully! ✦");
        triggerHaptic(10);
        trackEvent("photo_uploaded", {
          original_kb: result.originalSizeKb,
          optimized_kb: result.optimizedSizeKb,
          scaled_w: result.width,
          scaled_h: result.height
        });
      } catch (err) {
        console.warn("Downsampling failed, fallback to FileReader:", err);
        const reader = new FileReader();
        reader.onload = (e) => {
          userPhotoUrl = e.target.result;
          isUserUploaded = true;
          document.getElementById("entry-preview").src = userPhotoUrl;
          document.getElementById("res-original-img").src = userPhotoUrl;
          showToast("Photo uploaded successfully! ✦");
          triggerHaptic(10);
          trackEvent("photo_uploaded", { file_size_kb: Math.round(file.size / 1024) });
        };
        reader.readAsDataURL(file);
      }
    }

    function preloadImage(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = url;
        img.onload = () => resolve(img);
        img.onerror = () => resolve(img);
      });
    }

      const loader = document.getElementById("loader");
      const loaderText = document.getElementById("loader-text");
      const loaderSub = document.getElementById("loader-sub");
      const progressFill = document.getElementById("loader-progress-fill");
      const percentageText = document.getElementById("loader-percentage");

      loader.style.display = "flex";
      loader.style.opacity = "1";

      const startTime = Date.now();
      let progress = 18;
      progressFill.style.width = "18%";
      percentageText.innerText = "18%";

      // Exact milestones and text matching Screenshot 1
      const milestones = [
        { t: 0, text: "Locking facial ID & breed geometry...", sub: "Sampling authentic pet features [0.4s]", prog: 32 },
        { t: 600, text: "Synthesizing lighting & coat texture...", sub: "Dual softbox studio lighting [1.1s]", prog: 64 },
        { t: 1300, text: "Adding the final editorial finish...", sub: "Polishing tone and fine detail [2.5s]", prog: 94 }
      ];

      const stageTimers = [];
      milestones.forEach(m => {
        const tid = setTimeout(() => {
          loaderText.innerText = m.text;
          loaderSub.innerText = m.sub;
          progressFill.style.width = `${m.prog}%`;
          percentageText.innerText = `${m.prog}%`;
        }, m.t);
        stageTimers.push(tid);
      });

      let finalPosterImg = tpl.img;
      let responseData = null;

      try {
        const payload = {
          styleKey: theme.backendTheme || "corporate",
          themeId: theme.backendTheme || "corporate",
          itemId: tpl.id,
          templateId: tpl.id,
          petName: "Milo",
          imageBase64: isUserUploaded ? userPhotoUrl : undefined,
          isDefaultSample: !isUserUploaded

        const endpoint = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port === '3000'
          ? 'http://127.0.0.1:8787/api/generate'
          : '/api/generate';

        const apiPromise = fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(async (res) => {
          if (res.ok) {
            const json = await res.json();
            if (json.data) {
              responseData = json.data;
              if (json.data.imageUrl && !json.data.isFallback) {
                finalPosterImg = json.data.imageUrl;
              }
            }
          }
        }).catch((err) => {
          console.warn('[API Joint Debugging Warning]:', err);
        });

        await Promise.all([
          apiPromise,
          preloadImage(finalPosterImg),
          new Promise(r => setTimeout(r, 2200))
        ]);
      } catch(err) {
        console.warn('Fallback to template preview:', err);
        finalPosterImg = tpl.img;
        await preloadImage(finalPosterImg);
      } finally {
        stageTimers.forEach(clearTimeout);
        progressFill.style.width = "100%";
        percentageText.innerText = "100%";
        loaderText.innerText = "Portrait complete! Loading cover...";

        document.getElementById("res-display-img").src = finalPosterImg;
        document.getElementById("res-original-img").src = userPhotoUrl;
        const magTagEl = document.getElementById("mag-tag");
        if (magTagEl) magTagEl.innerText = tpl.tag;

          loader.style.opacity = "0";
          setTimeout(() => {

    function initCompareEvents() {

          originalLayer.style.opacity = "0";
          btn.classList.remove("active");

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

            Hold to compare

        }
      }

      window.resetCompareState = function() {
        isHolding = false;
        isToggled = false;
        setOriginalVisible(false);
      };

      const onPointerDown = (e) => {
        if (e) {
          e.stopPropagation();
          if (e.cancelable && e.type === "touchstart") e.preventDefault();
        }
        pressStartTime = Date.now();
        isHolding = true;

        if (!isToggled) {
          setOriginalVisible(true, false);
        }
      };

      const onPointerUp = (e) => {
        if (!isHolding) return;
        isHolding = false;
        const duration = Date.now() - pressStartTime;

        if (duration < 220) {
          // Quick Click / Tap (< 220ms): Toggle view!
          isToggled = !isToggled;
          setOriginalVisible(isToggled, true);
        } else {
          // Long Press / Hold (>= 220ms): Release to revert
          isToggled = false;
          setOriginalVisible(false, false);
        }
      };

      btn.addEventListener("touchstart", onPointerDown, { passive: false });
      btn.addEventListener("mousedown", onPointerDown);

      window.addEventListener("touchend", onPointerUp, { passive: true });
      window.addEventListener("touchcancel", () => {
        if (isHolding) {
          isHolding = false;
          isToggled = false;
          setOriginalVisible(false);
        }
      }, { passive: true });
      window.addEventListener("mouseup", onPointerUp, { passive: true });
      window.addEventListener("blur", () => {
        if (isHolding) {
          isHolding = false;
          isToggled = false;
          setOriginalVisible(false);
        }
      });
    }

    async function exportPoster() {
      triggerHaptic(12);
      const canvas = document.getElementById("render-canvas");
      const ctx = canvas.getContext("2d");
      const width = 1080;
      const height = 1440;
      canvas.width = width;
      canvas.height = height;

      try { await document.fonts.ready; } catch(e){}

      const theme = THEMES[activeThemeKey];
      const tpl = theme.templates.find(t => t.id === activeTemplateId) || theme.templates[0];
      const displayImg = document.getElementById("res-display-img");

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = displayImg.src;

      img.onload = () => {
        const targetRatio = width / height;
        const srcRatio = img.naturalWidth / img.naturalHeight;
        let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;

        if (srcRatio > targetRatio) {
          sw = img.naturalHeight * targetRatio;
          sx = (img.naturalWidth - sw) / 2;
        } else {
          sh = img.naturalWidth / targetRatio;
          sy = (img.naturalHeight - sh) / 2;
        }

        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, width, height);

        try {
          const dataUrl = canvas.toDataURL("image/png");
          currentPosterDataUrl = dataUrl;
          trackEvent("poster_exported", { theme: activeThemeKey, template: tpl.id, is_user_uploaded: isUserUploaded });

          // P0-2: Universal Mobile & In-App Webview Detection
          const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          const isWeChatOrInApp = /MicroMessenger|WeChat|Weibo|Instagram|TikTok/i.test(navigator.userAgent);

          if (isMobile || isWeChatOrInApp) {
            const modalImg = document.getElementById("save-modal-img");
            modalImg.src = dataUrl;

            // Check if Web Share API with files is supported
            const shareBtn = document.getElementById("modal-share-btn");
            if (navigator.share) {
              shareBtn.style.display = "block";
            } else {
              shareBtn.style.display = "none";
            }

            document.getElementById("save-modal").style.display = "flex";
            return;
          }

          // Desktop PC direct file download
          const a = document.createElement("a");
          a.download = `ViviBon-Cover-${tpl.id}-${Date.now()}.png`;
          a.href = dataUrl;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast("Saved 1080P portrait to downloads! ✦");
        } catch(err) {
          console.warn("Direct download restricted, opening save modal:", err);
          const dataUrl = canvas.toDataURL("image/png");
          currentPosterDataUrl = dataUrl;
          document.getElementById("save-modal-img").src = dataUrl;
          document.getElementById("save-modal").style.display = "flex";
        }
      };
    }

    let currentPosterDataUrl = null;

    async function sharePosterNative() {
      if (!currentPosterDataUrl || !navigator.share) return;
      try {
        const response = await fetch(currentPosterDataUrl);
        const blob = await response.blob();
        const file = new File([blob], `ViviBon-Cover-${Date.now()}.png`, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: 'ViviBon Cover',
            text: 'Look at my pet on the cover of Vogue! ✦',
            files: [file]
          });
          trackEvent("poster_shared_native");
        } else {
          await navigator.share({
            title: 'ViviBon Cover',
            text: 'Look at my pet on the cover of Vogue! ✦',
            url: window.location.href
          });
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.warn("Web Share failed:", err);
        }
      }
    }

    function closeSaveModal(e) {
      if (e) e.stopPropagation();
      document.getElementById("save-modal").style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderCategoryPills();
      renderTemplateCards();
      initDragScroll();
      initCompareEvents();
    });
  </script>
